apiVersion: apps/v1
kind: Deployment

metadata:
  name: cloudforge-frontend

spec:
  replicas: 2

  selector:
    matchLabels:
      app: cloudforge-frontend

  template:
    metadata:
      labels:
        app: cloudforge-frontend

    spec:
      containers:
      - name: frontend

        image: kuldeepkolage/cloudforge-frontend:v2

        ports:
        - containerPort: 5173

