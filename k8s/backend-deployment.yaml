apiVersion: apps/v1
kind: Deployment

metadata:
  name: cloudforge-backend

spec:
  replicas: 2

  selector:
    matchLabels:
      app: cloudforge-backend

  template:
    metadata:
      labels:
        app: cloudforge-backend

    spec:
      containers:
      - name: backend

        image: kuldeepkolage/cloudforge-backend:v1

        ports:
        - containerPort: 5000

        env:
        - name: PORT
          value: "5000"

        - name: MONGODB_URI
          value: "mongodb://mongodb:27017/cloudforge"
