version: '3.8'

services:

  mongodb:
    image: mongo:latest
    container_name: cloudforge-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  backend:
    build:
      context: ./backend
    container_name: cloudforge-backend
    ports:
      - "5000:5000"
    depends_on:
      - mongodb
    env_file:
      - ./backend/.env

  frontend:
    build:
      context: ./frontend
    container_name: cloudforge-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  mongodb_data:
